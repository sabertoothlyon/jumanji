 const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+d);s.connect(fl);fl.connect(g);g.connect(out());s.start(t,Math.random());s.stop(t+a+d+.1)}

 const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+d);o.connect(g);g.connect(out());o.start(t);o.stop(t+a+d+.1)}
